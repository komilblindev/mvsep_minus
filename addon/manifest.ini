name = mvsep_minus
summary = "MVSEP - Создатель Минусов"
description = """Дополнение NVDA для удаления вокала и создания профессиональных минусовок (инструменталов) через MVSEP API.

Горячие клавиши:
• По умолчанию не назначены. Назначьте удобные вам клавиши в Меню NVDA -> Параметры -> Жесты ввода -> категория 'MVSEP Создатель Минусов'.

Контакты разработчика:
• Разработчик: Komil Hamzayev <hamzayevkomil52@gmail.com>
• Telegram канал: @it_help_uz (https://t.me/it_help_uz)
• GitHub репозиторий: https://github.com/komilblindev/mvsep_minus
• Официальный сайт / API: https://mvsep.com/ru/full_api"""
author = "Komil Hamzayev <hamzayevkomil52@gmail.com>"
url = https://github.com/komilblindev/mvsep_minus
version = 1.0.2
minimumNVDAVersion = 2019.3.0
lastTestedNVDAVersion = 2026.2.0
docFileName = readme.html
changelog = """Версия 1.0.2:
- Поддержка разделения по удаленным аудио-ссылкам (Google Drive, Dropbox, MEGA, прямые URL).
- Просмотр истории разделений аккаунта на сайте и прямое скачивание.
- Проверка загрузки и очереди сервера в реальном времени.
- Автоматическое переключение на резервный аккаунт при исчерпании лимитов.
- Логирование ошибок в файл и отправка разработчику в один клик.
- Полная поддержка 3 языков (O'zbekcha, Русский, English).
- Совместимость с NVDA от 2019.3 до 2026.2.

Версия 1.0.1:
- Управление несколькими аккаунтами (Multi-Account) и баланс кредитов.
- Оптимизация диалогов и настроек NVDA.

Версия 1.0.0:
- Релиз первой версии дополнения для создания минусовок.
- Интеграция с официальным API MVSEP (BS Roformer, MelBand, SCNet, Demucs, Karaoke и др.).
- Озвучивание баланса и кредитов на аккаунте.
- Поддержка настраиваемых жестов ввода NVDA."""
