name = mvsep_minus
summary = "MVSEP Создатель Минусов"
description = """Дополнение NVDA для удаления вокала и создания профессиональных минусовок (инструменталов) через MVSEP API.

Горячие клавиши:
• NVDA + Alt + M : Создать минус
• NVDA + Alt + K : Озвучить остаток кредитов на аккаунте MVSEP
• NVDA + Alt + Shift + M : Открыть настройки MVSEP

Контакты разработчика:
• Разработчик: Komil Hamzayev <hamzayevkomil52@gmail.com>
• Telegram канал: @it_help_uz (https://t.me/it_help_uz)
• GitHub репозиторий: https://github.com/komilblindev/mvsep_minus
• Официальный сайт / API: https://mvsep.com/ru/full_api"""
author = "Komil Hamzayev <hamzayevkomil52@gmail.com>"
url = https://github.com/komilblindev/mvsep_minus
version = 1.0.0
minimumNVDAVersion = 2019.3.0
lastTestedNVDAVersion = 2026.1.0
docFileName = readme.html
changelog = """Версия 1.0.0
- Релиз первой версии дополнения для создания минусовок.
- Интеграция с официальным API MVSEP (BS Roformer, MelBand, SCNet, Demucs, Karaoke и др.).
- Озвучивание баланса и кредитов на аккаунте.
- Поддержка горячих клавиш NVDA."""
